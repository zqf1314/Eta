name: Build APK (大肥鱼)

# fork 后用于产出带自定义文案的安装包。
# Debug 与 Release 同时构建：Release 使用仓库 Secrets 里的自备 keystore 签名，
# 并把签名包挂到 Release 上，方便免登录直连下载。
on:
  workflow_dispatch:
  push:
    branches:
      - feat/rename-to-daifeiyu

permissions:
  contents: write

concurrency:
  group: build-daifeiyu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Debug 与已签名 Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 还原发布证书
        env:
          ETA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$ETA_RELEASE_KEYSTORE_BASE64" ||
                -z "$ETA_RELEASE_STORE_PASSWORD" ||
                -z "$ETA_RELEASE_KEY_ALIAS" ||
                -z "$ETA_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::缺少 Release 签名 Secrets。"
            exit 1
          fi
          printf '%s' "$ETA_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/eta-release.jks"

      - name: 构建 Debug 与 Release APK
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-release.jks
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          "-Peta.buildMetadata=${GITHUB_SHA::7}"
          :app:assembleDebug :app:assembleRelease

      - name: 验证签名并整理产物
        run: |
          shopt -s nullglob
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::未找到 apksigner。"
            exit 1
          fi

          debug_apks=(app/build/outputs/apk/debug/*.apk)
          release_apks=(app/build/outputs/apk/release/*.apk)
          echo "Debug 产物: ${#debug_apks[@]}  Release 产物: ${#release_apks[@]}"

          for apk in "${release_apks[@]}"; do
            echo "::group::签名校验 $apk"
            "$apksigner_path" verify --print-certs "$apk"
            echo "::endgroup::"
          done

          for apk in "${debug_apks[@]}" "${release_apks[@]}"; do
            ls -lh "$apk"
            echo "sha256 $(sha256sum "$apk" | cut -d' ' -f1)  $(basename "$apk")"
          done

          if [[ ${#release_apks[@]} -eq 0 ]]; then
            echo "::error::未生成 Release APK。"
            exit 1
          fi

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eta-debug-daifeiyu-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传 Release APK（已签名）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eta-release-signed-daifeiyu-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # Actions Artifact 在公开仓库也要求登录；挂到 Release 才能免登录直连下载
      - name: 发布 Release 资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="daifeiyu-${GITHUB_SHA::7}"
          apk="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          echo "APK: $apk"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "大肥鱼 ${GITHUB_SHA::7}" \
              --notes "输入框与全局文案改为「大肥鱼」的构建产物，keystore 与 daifeiyu 系列一致。" \
              --prerelease
          fi

          echo "下载页: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          echo "直链: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$(basename "$apk")"